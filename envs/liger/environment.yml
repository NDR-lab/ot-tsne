# Separate environment for the current LIGER adapter.
name: liger2

channels:
  - conda-forge
  - bioconda

dependencies:
  - r-base=4.5.3
  - r-hdf5r=1.3.12
  - r-remotes=2.5.0
  - r-rcpp=1.1.2
  - r-rcpparmadillo=15.4.2_1
  - r-rcppplanc=2.0.16
  # rliger 2.2.1 dependencies whose CRAN/Bioconductor source builds need zlib and GMP headers
  # that are absent on some clusters. Binary builds, pinned to the recorded working liger2 env.
  - bioconductor-delayedarray=0.36.1
  - bioconductor-hdf5array=1.38.0
  - bioconductor-rhdf5=2.54.1
  - bioconductor-rhdf5lib=1.32.0
  - bioconductor-rhdf5filters=1.22.0
  - bioconductor-sparsearray=1.10.10
  - bioconductor-matrixgenerics=1.22.0
  - bioconductor-xvector=0.50.0
  - bioconductor-s4arrays=1.10.1
  - r-matrixstats=1.5.0
  - r-leidenalg=1.1.8
  - c-compiler=1.11.0
  - cxx-compiler=1.11.0
  - fortran-compiler=1.11.0
  - make=4.4.1
