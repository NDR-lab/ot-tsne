# Isolated interpreter for the `multimap` method (MultiMAP's UMAP/numba stack needs numpy < 2,
# the main environment uses numpy >= 2). Restore with:
#   UV_PROJECT_ENVIRONMENT=<venv> uv sync --locked --project envs/multimap
# Versions are the environment that produced the published benchmark; uv.lock adds hashes.
[project]
name = "ne-aligned-multimap-env"
version = "0"
requires-python = "==3.11.*"
dependencies = [
    "anndata==0.12.19",
    "array-api-compat==1.15.0",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "donfig==0.8.1.post1",
    "fonttools==4.63.0",
    "google-crc32c==1.8.0",
    "h5py==3.16.0",
    "joblib==1.5.3",
    "kiwisolver==1.5.0",
    "legacy-api-wrap==1.5",
    "llvmlite==0.48.0",
    "matplotlib==3.11.1",
    "multimap @ git+https://github.com/Teichlab/MultiMAP.git@681e608c45cdb6b139dfb6700e40c7520bc6096d",
    "narwhals==2.24.0",
    "natsort==8.4.0",
    "networkx==3.6.1",
    "numba==0.66.0",
    "numcodecs==0.16.5",
    "numpy==1.26.4",
    "packaging==26.2",
    "pandas==2.3.3",
    "patsy==1.0.2",
    "pillow==12.3.0",
    "pynndescent==0.6.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.3.post1",
    "pyyaml==6.0.3",
    "scanpy==1.11.5",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "scverse-misc==0.0.3",
    "seaborn==0.13.2",
    "session-info2==0.4.1",
    "six==1.17.0",
    "statsmodels==0.14.6",
    "threadpoolctl==3.6.0",
    "tqdm==4.69.1",
    "typing-extensions==4.16.0",
    "tzdata==2026.3",
    "umap-learn==0.5.12",
    "zarr==3.1.5",
]

[tool.uv]
package = false
